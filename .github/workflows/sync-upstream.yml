name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger from the Actions UI

jobs:
  sync:
    name: Sync Upstream Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Nertwork Sync Bot"
          git config --global user.email "bot@nertwork.com"

      - name: Fetch and Merge Upstream
        run: |
          # Add the primary upstream repository as a remote
          git remote add upstream https://github.com/JeffSteinbok/hass-dreo.git
          git fetch upstream
          
          # Checkout main and merge upstream/main
          git checkout main
          git merge upstream/main -m "chore(git): auto-merge latest upstream changes"
          
          # Push back to our fork using GitHub GITHUB_TOKEN
          git push origin main
